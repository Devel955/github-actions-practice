name: Deploy After Tests

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: exit 1

      - if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: echo "Deploying..."
