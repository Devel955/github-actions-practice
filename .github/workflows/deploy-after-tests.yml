name: Deploy After Tests

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check workflow result
        run: |
          echo "Triggered workflow conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Stop if tests failed
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "Tests failed. Deployment will not proceed."
          exit 1

      - name: Deploy
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          echo "Deploying after successful tests 🚀"
