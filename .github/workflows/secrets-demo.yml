name: Day 44 - Secrets Demo

on:
  push:
    branches:
      - main
      - "**"

jobs:
  secrets-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check if secret is set
        env:
          MY_SECRET_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$MY_SECRET_MESSAGE" ]; then
            echo "The secret is set: true"
          else
            echo "The secret is set: false"
            exit 1
          fi

      - name: Try printing secret directly
        run: |
          echo "Secret value: ${{ secrets.MY_SECRET_MESSAGE }}"
