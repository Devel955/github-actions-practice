name: Day 43 - Job Outputs

on:
  push:
    branches:
      - "**"

jobs:
  generate-date:
    runs-on: ubuntu-latest
    outputs:
      today_date: ${{ steps.set_date.outputs.today_date }}

    steps:
      - name: Set today's date
        id: set_date
        run: echo "today_date=$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT

  read-date:
    runs-on: ubuntu-latest
    needs: generate-date
    steps:
      - name: Print date from previous job
        run: echo "Date received from previous job: ${{ needs.generate-date.outputs.today_date }}"
        
