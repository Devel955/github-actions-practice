name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  branch-check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ ! "${{ github.head_ref }}" =~ ^(feature|fix|docs)/ ]]; then
            echo "Invalid branch name"
            exit 1
          fi

  pr-body-check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "PR description missing"
          fi
